<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Guide to Growing Up</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}
:root{--ink:#1d2540;--paper:#f6f8fb;--sun:#ffc43d}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
button,textarea,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 .5rem;font-weight:800}
.pad{padding:1.5rem 1.2rem}
.tile{display:block;width:100%;text-align:left;border:0;border-radius:22px;padding:1.2rem;margin:.8rem 0;color:#fff;background:var(--c)}
.tile h2{margin:0 0 .2rem;font-size:1.3rem}
.tile p{margin:0}
.tile.lock{background:#dfe4ee;color:#566077;cursor:default}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;padding:.6rem 0}
.lesson{flex:1;display:flex;flex-direction:column;background:var(--c);color:#fff;padding:1rem 1.2rem}
.top{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.8rem}
.top button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:14px;padding:.4rem .8rem}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px}
.bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1rem 0}
.card h2{font-size:1.9rem;line-height:1.15;margin:0 0 1rem}
.card p{font-size:1.15rem;margin:0 0 .8rem}
.card textarea{width:100%;border:0;border-radius:14px;padding:.8rem;min-height:5rem;color:var(--ink)}
.row{display:flex;gap:.6rem;padding:.6rem 0}
.btn{flex:1;border:0;border-radius:16px;padding:.9rem;font-weight:700;background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.2);color:#fff}
.btn:disabled{opacity:.45}
.fb{background:rgba(255,255,255,.18);border-radius:14px;padding:.8rem 1rem;margin-top:.6rem}
.flag{align-self:flex-start;background:none;border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:14px;padding:.35rem .8rem;margin-top:.4rem}
.flag[aria-pressed=true]{background:#fff;color:var(--ink)}
#sheet{position:fixed;inset:0;background:rgba(29,37,64,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet div{background:#fff;color:var(--ink);border-radius:24px 24px 0 0;padding:1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));width:100%;max-width:560px}
#sheet .btn{background:var(--ink);color:#fff}#sheet .btn.ghost{background:#e9edf5;color:var(--ink)}
.par li{margin:.4rem 0}
input.pin{font-size:1.4rem;letter-spacing:.4rem;width:8rem;padding:.4rem .6rem;border:2px solid var(--ink);border-radius:12px}
.sw{background:#fff;color:var(--ink);border-radius:20px;padding:1.4rem 1.2rem;font-size:1.3rem;font-weight:700;touch-action:pan-y;user-select:none;margin-bottom:.8rem;cursor:grab}
.tr{margin:.5rem 0;font-size:.95rem}.tr small{opacity:.8}.tr:not(.on) span{opacity:.7}
.tk{position:relative;height:10px;background:rgba(255,255,255,.2);border-radius:5px;margin-top:.2rem}
.tk i{position:absolute;top:0;height:100%;background:rgba(255,255,255,.5);border-radius:5px}
.tr.on .tk i{background:#fff}
.tk::after{content:"";position:absolute;top:-4px;bottom:-4px;left:calc(var(--p) * 1%);width:3px;background:var(--sun);border-radius:2px}
.dg{background:#fff;border-radius:18px;padding:.4rem;margin-bottom:.6rem}.dg svg{display:block;width:100%;max-height:46vh}
.pt{cursor:pointer}.pt.sel{stroke:#ff9f1c;stroke-width:5}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}.chip{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:14px;padding:.35rem .75rem}.chip[aria-pressed=true]{background:#fff;color:var(--ink)}
.pd{min-height:3.4rem;margin-top:.6rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body><main id="app"></main><div id="sheet" hidden></div>
<script>
const M=[
{id:'p',t:'What is puberty?',d:'How bodies change as kids grow up',c:'#0e7c7b',
cards:[
['Puberty is your body growing up','Puberty is when a kid\'s body changes into a grown-up\'s body. It happens to everyone, and it takes several years.'],
['Everyone has their own schedule','It usually starts somewhere between ages 8 and 14. Some kids start early and some start late. Both are normal, and neither one means anything is wrong.'],
['Slide through the ages','Move the slider to see when changes often happen. The bright bars are the usual ranges. They are approximate, and plenty of healthy kids fall outside them.','tl'],
['What changes for everyone','You grow fast in spurts. You sweat more and get body odor, so deodorant and showers help. Hair grows in new places. Skin gets oilier and pimples can show up. Feelings can get bigger and moods can swing.'],
['What often changes for boys','The penis and testicles grow, the voice gets deeper (it can crack along the way), and facial hair starts. Erections can happen for no reason. Wet dreams can happen too: semen comes out during sleep. That is not pee, and it is normal.'],
['What often changes for girls','Breasts grow, hips get wider, and periods start. A period is when blood leaves the body through the vagina for a few days. It happens about once a month, and it is a healthy sign that the body is growing up.'],
['How breasts develop','For girls, breast development is often one of the first signs of puberty. It usually starts with a small, sometimes tender bump under the nipple, called a breast bud. One side can start before the other, or end up a different size, and that is normal. Breasts keep growing over a few years, and every size and shape is normal. Whether to wear a bra, and when, is about comfort and is a personal choice.'],
['Inside a developing breast','Tap a part to see what it does. These are simplified side views of the tissue at three points during puberty.','an','b'],
['Boys can get breast bumps too','During puberty, many boys get a small, sometimes tender bump under one or both nipples. It happens because hormones are changing, and it usually goes away on its own within a year or two. It does not mean anything is wrong with you. If it is very painful, keeps growing, or does not go away, tell a trusted adult, who can check with a doctor.'],
['Feelings are part of it','Crushes, awkward moments, and mood swings are all common. If something feels confusing or worrying, you can always talk to a grown-up you trust.']],
qs:[
['If your friends change before you do, something is wrong with you.',0,'Bodies change on different schedules. Early or late is normal.'],
['Erections and wet dreams are normal for boys.',1,'They are a normal part of puberty, and nothing to be embarrassed about.'],
['Periods are a normal, healthy part of growing up.',1,'They are. Teasing someone about a period is never okay.'],
['Everyone\'s voice and height change at exactly the same age.',0,'Everyone is on their own timeline.'],
['Pimples show up because you are dirty.',0,'Hormones make skin oilier. Washing helps, but dirt is not the cause.'],
['Sweating more during puberty is normal.',1,'Sweat glands get more active, so deodorant and showers help.'],
['Breast bumps can happen to boys during puberty.',1,'It is common, usually temporary, and nothing to be embarrassed about.'],
['Both breasts must grow at exactly the same speed.',0,'It is normal for one side to start first or end up a little different.']],
talk:['What surprised you most?','Was anything confusing or worrying?','What do you want to know more about?']},
{id:'c',t:'Bodies, boundaries & consent',d:'Your body, your choices, and respecting others',c:'#5a49e0',
cards:[
['Your body is yours','You get to decide who touches you and how. That includes hugs, high-fives, tickling, and wrestling. You can say no, even to people you like and even to family.'],
['Ask first, every time','Before you hug, touch, or take a photo of someone, ask. A yes has to be a real yes. If someone feels pressured or stays quiet, it is not a yes.'],
['When someone says no','Stop right away. No arguing. A spoken no, going quiet, or pulling away all mean stop. Respecting a no is how you show you are a good friend.'],
['Surprises vs. secrets','A surprise is happy and ends soon, like a birthday present. A secret about touching, or one that makes you feel scared, sad, or confused, is one to tell a trusted adult about, even if someone told you not to. You will not be in trouble.'],
['Your trusted adults','Pick three grown-ups you could tell anything. If the first one does not help, tell the next one. Write their names here if you like. They stay on this device.','inp'],
['Photos and the internet','Never ask for or share pictures of anyone\'s private body parts. Ask before posting a photo of a friend. If something upsets you online, or someone asks for private pictures, close it and tell a trusted adult. You will not be in trouble.']],
qs:[
['You can say no to a hug, even from someone you love.',1,'Your body is yours. Saying no is always allowed.'],
['If a friend says no to wrestling but is laughing, you can keep going.',0,'Stop and ask. A no means stop, even if it seems like a joke.'],
['If someone asks you to keep a touching secret, you should keep it.',0,'Tell a trusted adult. You will not be in trouble.']],
talk:['When might it be hard to say no? What could you say?','Who are your trusted adults?','What would you do if you saw something upsetting online?']},
{id:'r',t:'How babies are made',d:'Sperm, eggs, pregnancy, and birth',c:'#a62f5a',
cards:[
['Where babies come from','A baby starts when a sperm cell from a male body joins an egg cell from a female body. It takes both. These cells are so tiny that you need a microscope to see them.'],
['Bodies that make sperm','Testicles make sperm, and they start making it during puberty. Sperm leave the body in a fluid called semen, which comes out through the penis.'],
['See it: male body parts','Tap a part to see what it does. This is a side view, as if the body were cut in half.','an','m'],
['Bodies that hold eggs','People born female have eggs stored in their ovaries. During puberty, about once a month, an ovary lets go of one egg. It travels through a tube toward the uterus, a strong, pear-shaped organ where a baby can grow.'],
['See it: female body parts','Tap a part to see what it does. This is a front view.','an','f'],
['Where periods fit in','Each month the uterus builds up a soft lining, just in case an egg joins with a sperm. If that does not happen, the lining leaves the body. That is a period.'],
['How sperm and egg meet','For a sperm to reach an egg inside a body, two adults can have sex. The penis goes inside the vagina, and semen with sperm comes out. Adults can also have sex to feel close, not only to have a baby. Some people need a doctor\'s help to get a sperm and an egg together.'],
['Sex is for adults, with consent','Sex is only okay between adults who both clearly and freely say yes. It is never for kids. No adult or older kid should ever touch a kid\'s private parts or ask a kid to do sex things. If that happens, it is never the kid\'s fault. Tell a trusted adult. You will not be in trouble.'],
['Growing a baby','When a sperm joins an egg, it can grow into a baby inside the uterus. Pregnancy lasts about nine months. The baby gets food and oxygen through a cord that connects it to the person carrying it. Your belly button is where your cord was.'],
['Being born','Many babies are born through the vagina. Some are born by C-section, when doctors lift the baby out through an opening in the belly. Both are normal ways to be born.'],
['Many kinds of families','Families begin in lots of ways: birth, adoption, foster care, or with help from doctors. A family can have one parent, two parents, grandparents, or other caring adults. What makes a family is love and care.']],
qs:[
['A baby starts when a sperm and an egg join.',1,'It takes both cells to start a baby.'],
['Babies grow in the stomach.',0,'Babies grow in the uterus. The stomach is for digesting food.'],
['A period is when the lining of the uterus leaves the body.',1,'Yes. It is a normal sign that the body is growing up.'],
['Sex is only for adults.',1,'Right. It is never for kids, and it always needs a clear yes from both adults.'],
['All babies are born the same way.',0,'Some are born through the vagina and some by C-section. Both are normal.'],
['Only families with a mom and a dad are real families.',0,'Families come in many shapes. Love and care are what make a family.']],
talk:['What part was new to you?','What questions do you have that the app did not answer?','How did the part about how sperm and egg meet feel to read?']},
{id:'o',t:'Staying safe online',d:'Coming soon',lock:1}];
let S;try{S=JSON.parse(localStorage.getItem('fg')||'{}')}catch(e){S={}}
S.done=S.done||{};S.flags=S.flags||{};
const save=()=>{try{localStorage.setItem('fg',JSON.stringify(S))}catch(e){}};
const mod=id=>M.find(m=>m.id===id);
let view={n:'h'};
const $=s=>document.querySelector(s);
function render(){
 const a=$('#app');
 if(view.n==='h'){a.innerHTML='<div class="pad"><h1>Field Guide to Growing Up</h1><p>Explore at your own pace. Skip anything, any time.</p>'+M.map(m=>m.lock?`<div class="tile lock"><h2>${m.t}</h2><p>${m.d}</p></div>`:`<button class="tile" style="--c:${m.c}" data-a="open" data-v="${m.id}"><h2>${m.t}${S.done[m.id]?' ✓':''}</h2><p>${m.d}</p></button>`).join('')+'<button class="link" data-a="par">For parents</button></div>'}
 else if(view.n==='l'){
  const m=mod(view.id),n=m.cards.length+m.qs.length,i=view.i,isC=i<m.cards.length,k=m.id+':'+i;
  let h=`<div class="lesson" style="--c:${m.c}"><div class="top"><button data-a="home">Home</button><button data-a="worry">I'm confused or worried</button></div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div><div class="card">`;
  if(isC){const c=m.cards[i];h+=`<h2>${c[0]}</h2><p>${c[1]}</p>`+(c[2]==='inp'?'<textarea id="ta" aria-label="My trusted adults" placeholder="Three names"></textarea>':c[2]==='tl'?tl(view.age||11):c[2]==='an'?an(c[3]):'')+`<button class="flag" data-a="flag" aria-pressed="${!!S.flags[k]}">I want to talk about this</button>`}
  else{const q=m.qs[i-m.cards.length];h+=`<h2>Myth or fact?</h2><div class="sw">${q[0]}</div><p><small>Swipe the card left for myth and right for fact, or tap a button.</small></p><div class="row"><button class="btn" data-a="ans" data-v="m" ${view.a?'disabled':''}>Myth</button><button class="btn" data-a="ans" data-v="f" ${view.a?'disabled':''}>Fact</button></div>`+(view.a?`<div class="fb" role="status"><b>${(view.a==='f')===!!q[1]?'Right!':'Not quite.'}</b> ${q[2]}</div>`:'')}
  h+=`</div><div class="row"><button class="btn ghost" data-a="prev" ${i?'':'disabled'}>Back</button><button class="btn" data-a="next" ${!isC&&!view.a?'disabled':''}>${i+1>=n?'Finish':'Next'}</button></div></div>`;
  a.innerHTML=h;const t=$('#ta');if(t)t.value=S.trusted||'';if(view.n==='l'&&view.pi===view.i&&view.part)document.querySelectorAll('.pt[data-v="'+view.part+'"]').forEach(e=>e.classList.add('sel'));
 }else{
  let h='<div class="pad par"><button class="link" data-a="home">Back</button><h1>For parents</h1>';
  if(!S.pin)h+='<p>Set a 4-digit PIN. It keeps this area out of casual reach; it is not strong security.</p><input class="pin" id="pin" inputmode="numeric" maxlength="4" type="password" aria-label="New PIN"> <button class="btn" style="flex:none;background:var(--ink);color:#fff" data-a="setpin">Save PIN</button>';
  else if(!view.ok)h+=`<p>Enter your PIN.</p><input class="pin" id="pin" inputmode="numeric" maxlength="4" type="password" aria-label="PIN"> <button class="btn" style="flex:none;background:var(--ink);color:#fff" data-a="unlock">Open</button><p>${view.msg||''}</p>`;
  else{const f=Object.values(S.flags);h+='<h2>He wants to talk about</h2>'+(f.length?'<ul>'+f.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p>Nothing flagged yet.</p>')+'<h2>Conversation starters</h2>'+M.filter(m=>m.talk).map(m=>`<h3>${m.t}</h3><ul>${m.talk.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')+'<p><button class="link" data-a="reset">Reset progress and flags</button></p>'}
  a.innerHTML=h+'</div>'}
}
function act(a,v){
 if(a==='open')view={n:'l',id:v,i:0};
 else if(a==='home')view={n:'h'};
 else if(a==='par')view={n:'p'};
 else if(a==='prev'){view.i--;view.a=null}
 else if(a==='next'){const m=mod(view.id);if(view.i+1>=m.cards.length+m.qs.length){S.done[m.id]=1;save();view={n:'h'}}else{view.i++;view.a=null}}
 else if(a==='part'){view.part=v;view.pi=view.i}
 else if(a==='ans')view.a=v;
 else if(a==='flag'){const m=mod(view.id),k=m.id+':'+view.i;if(S.flags[k])delete S.flags[k];else S.flags[k]=m.t+': "'+m.cards[view.i][0]+'"';save()}
 else if(a==='worry'){const s=$('#sheet');s.hidden=false;s.innerHTML='<div role="dialog" aria-label="Confused or worried"><h2>That\'s okay</h2><p>Lots of kids feel confused or worried about this stuff. You can skip anything, any time. The best next step is to talk with a grown-up you trust. You will not be in trouble for asking.</p><div class="row"><button class="btn ghost" data-a="close">Close</button><button class="btn" data-a="wflag">Mark to talk about</button></div></div>';return}
 else if(a==='wflag'){const m=mod(view.id);S.flags['w'+Date.now()]='Felt confused or worried during "'+m.t+'"';save();$('#sheet').hidden=true;return}
 else if(a==='close'){$('#sheet').hidden=true;return}
 else if(a==='setpin'){const p=$('#pin').value;if(/^\d{4}$/.test(p)){S.pin=p;save();view.ok=true}}
 else if(a==='unlock'){if($('#pin').value===S.pin)view.ok=true;else view.msg='That PIN does not match.'}
 else if(a==='reset'){if(confirm('Reset all progress and flags?')){S.done={};S.flags={};save()}}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
const TL=[['Sweat and body odor','Everyone',8,14],['Hair in new places','Everyone',8,14],['Oily skin and pimples','Everyone',9,15],['Breasts start to grow','Girls',8,13],['Growth spurt','Girls',9,14],['First period','Girls',10,15],['Testicles and penis grow','Boys',9,14],['Growth spurt','Boys',11,16],['Voice gets deeper','Boys',12,16],['Facial hair starts','Boys',13,17]];
const AN={
f:{s:`<svg viewBox="20 60 260 225" role="img" aria-label="Front view diagram of the female reproductive system"><path class="pt" data-a="part" data-v="vagina" d="M141 190 L135 275 L165 275 L159 190 Z" fill="#f0a5b9" stroke="#1d2540" stroke-width="2"/><path class="pt" data-a="part" data-v="uterus" d="M118 95 Q150 78 182 95 L192 125 Q178 160 160 174 L140 174 Q122 160 108 125 Z" fill="#e58aa5" stroke="#1d2540" stroke-width="2"/><rect class="pt" data-a="part" data-v="cervix" x="140" y="172" width="20" height="22" rx="7" fill="#c9577a" stroke="#1d2540" stroke-width="2"/><path class="pt" data-a="part" data-v="tube" d="M116 104 Q88 78 62 98" fill="none" stroke="#c9577a" stroke-width="8" stroke-linecap="round"/><path class="pt" data-a="part" data-v="tube" d="M184 104 Q212 78 238 98" fill="none" stroke="#c9577a" stroke-width="8" stroke-linecap="round"/><ellipse class="pt" data-a="part" data-v="ovary" cx="50" cy="110" rx="21" ry="15" fill="#f6c1d0" stroke="#1d2540" stroke-width="2"/><ellipse class="pt" data-a="part" data-v="ovary" cx="250" cy="110" rx="21" ry="15" fill="#f6c1d0" stroke="#1d2540" stroke-width="2"/></svg>`,p:{ovary:['Ovary','Where eggs are stored. About once a month, an ovary lets go of one egg.'],tube:['Fallopian tube','A thin tube the egg travels through toward the uterus. This is where a sperm can meet an egg.'],uterus:['Uterus','Where a baby can grow. Its soft lining leaves the body during a period.'],cervix:['Cervix','The narrow neck at the bottom of the uterus.'],vagina:['Vagina','A stretchy tube from the cervix to the outside of the body. Periods and babies leave the body this way.']}},
m:{s:`<svg viewBox="70 40 200 220" role="img" aria-label="Side view diagram of the male reproductive system"><ellipse class="pt" data-a="part" data-v="scrotum" cx="190" cy="205" rx="36" ry="44" fill="#b9c5de" stroke="#1d2540" stroke-width="2"/><ellipse class="pt" data-a="part" data-v="testicle" cx="190" cy="208" rx="19" ry="28" fill="#7c8fc4" stroke="#1d2540" stroke-width="2"/><path class="pt" data-a="part" data-v="epi" d="M205 190 Q218 210 205 232" fill="none" stroke="#e08a3c" stroke-width="6" stroke-linecap="round"/><path class="pt" data-a="part" data-v="vas" d="M203 188 Q205 140 192 118 Q182 104 166 101" fill="none" stroke="#5a49e0" stroke-width="5" stroke-linecap="round"/><ellipse class="pt" data-a="part" data-v="bladder" cx="150" cy="80" rx="34" ry="28" fill="#9fd3d1" stroke="#1d2540" stroke-width="2"/><rect class="pt" data-a="part" data-v="penis" x="131" y="135" width="38" height="108" rx="18" transform="rotate(14 150 145)" fill="#cfd8ea" stroke="#1d2540" stroke-width="2"/><path class="pt" data-a="part" data-v="urethra" d="M150 108 L150 145 L128 236" fill="none" stroke="#1d2540" stroke-width="4" stroke-linecap="round"/></svg>`,p:{testicle:['Testicle','Makes sperm, starting in puberty.'],scrotum:['Scrotum','The pouch of skin that holds the testicles.'],epi:['Epididymis','Where sperm finish growing and wait until they are needed.'],vas:['Vas deferens','A tube that carries sperm up toward the urethra.'],bladder:['Bladder','Holds pee. It is not part of making sperm, but it sits close by.'],urethra:['Urethra','A tube inside the penis. Pee and semen both leave through it, but never at the same time.'],penis:['Penis','The outside part. It carries pee and semen out of the body.']}},
